/* ---------- Toast, tooltip, announcements ---------- */
function toast(msg, action) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${msg}</span>${action || ''}`;
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > 3) $('#toasts').firstElementChild.remove();
  setTimeout(() => el.remove(), 4500);
}
function announce(msg) { const l = $('#sr-live'); l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 30); }
const tip = $('#tooltip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t || dragState) { tip.classList.remove('show'); return; }
  tip.textContent = t.dataset.tip;
  tip.classList.add('show');
});
document.addEventListener('mousemove', e => {
  if (!tip.classList.contains('show')) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 12, y = e.clientY - h - 10;
  if (x + w > innerWidth - 8) x = e.clientX - w - 12;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
});
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tip.classList.remove('show'); });

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const menu = $('#menu-root');
  if (menu.innerHTML && !e.target.closest('.user-menu') && !e.target.closest('[data-action="user-menu"]')) menu.innerHTML = '';
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const key = el.dataset.key;
  switch (a) {
    case 'open-project': if (!e.target.closest('a')) go(`#/p/${key}/summary`); break;
    case 'open-issue': e.preventDefault(); e.stopPropagation(); if (!$('#modal-root').innerHTML || el.closest('.modal')) { closeModal(); openIssue(key); } break;
    case 'close-issue': closeIssue(); break;
    case 'create-issue': modalCreateIssue({ fromBoard: !!el.dataset.status }); break;
    case 'create-project': modalCreateProject(); break;
    case 'close-modal': closeModal(); break;
    case 'modal-backdrop': if (e.target === el) closeModal(); break;
    case 'hide-banner': UI.bannerHidden = true; render(); break;
    case 'toggle-theme': {
      const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nextT = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextT;
      try { localStorage.setItem(THEME_KEY, nextT); } catch (err) { /* ignore */ }
      $('#menu-root').innerHTML = '';
      render(); break;
    }
    case 'notifications': toast('Notifications arrive with the Comments &amp; notifications module.'); break;
    case 'user-menu': e.stopPropagation(); userMenu(); break;
    case 'switch-user': S.currentUserId = el.dataset.id; save(); $('#menu-root').innerHTML = ''; render(); toast(`You are now <b>${esc(me().name)}</b> (${esc(me().role)})`); break;
    case 'reset-demo': S = seed(); save(); $('#menu-root').innerHTML = ''; go('#/projects'); render(); toast('Demo data reset'); break;
    case 'pick-template': {
      $$('.tmpl').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      el.closest('form').elements.type.value = el.dataset.tmpl; break;
    }
    case 'toggle-section': UI.backlog.collapsed[el.dataset.id] = !UI.backlog.collapsed[el.dataset.id]; render(); break;
    case 'start-sprint': modalStartSprint(sprint(el.dataset.id)); break;
    case 'complete-sprint': modalCompleteSprint(sprint(el.dataset.id)); break;
    case 'create-sprint': {
      const p = currentProject();
      const list = sprintsOf(p.id);
      const seq = Math.max(0, ...list.map(s => s.seq)) + 1;
      const lastEnd = list.length ? list.reduce((m, s) => s.endDate > m ? s.endDate : m, TODAY) : TODAY;
      S.sprints.push({ id: uid(), projectId: p.id, seq, name: `${p.key} Sprint ${seq}`, goal: '', state: 'planned', startDate: addDays(lastEnd, 1), endDate: addDays(lastEnd, 14) });
      save(); render(); toast(`${p.key} Sprint ${seq} created`); break;
    }
    case 'move-menu': modalMove(issueByKey(key), el.dataset.context); break;
    case 'do-move': doMove(el); break;
    case 'toggle-assignee': {
      const f = UI.board; const id = el.dataset.id;
      f.assignees = f.assignees.includes(id) ? f.assignees.filter(x => x !== id) : [...f.assignees, id];
      render(); break;
    }
    case 'clear-board-filters': UI.board = { q: '', mine: false, epic: '', assignees: [] }; render(); break;
    case 'sort': { const f = UI.issues; const s = el.dataset.sort; if (f.sort === s) f.dir *= -1; else { f.sort = s; f.dir = s === 'updatedAt' ? -1 : 1; } render(); break; }
    case 'tl-zoom': UI.timeline.zoom = el.dataset.zoom; render(); scrollTimelineToToday(); break;
    case 'tl-today': scrollTimelineToToday(true); break;
    case 'tl-expand': UI.timeline.expanded[el.dataset.id] = !UI.timeline.expanded[el.dataset.id]; render(); break;
    case 'tl-expand-all': {
      const p = currentProject(); const any = Object.values(UI.timeline.expanded).some(Boolean);
      UI.timeline.expanded = {}; if (!any) epicsOf(p.id).forEach(ep => { UI.timeline.expanded[ep.id] = true; });
      render(); break;
    }
    case 'tl-schedule': { const is = issueByKey(key); updateIssue(is, { startDate: TODAY, dueDate: addDays(TODAY, 27) }); toast(`${is.key} scheduled for 4 weeks`); break; }
    case 'edit-desc': UI.editingDesc = true; render(); setTimeout(() => $('#pi-desc')?.focus(), 0); break;
    case 'cancel-desc': UI.editingDesc = false; render(); break;
    case 'panel-tab': UI.panelTab = el.dataset.tab; render(); break;
    case 'assign-me': updateIssue(issueByKey(key), { assigneeId: S.currentUserId }); break;
    case 'delete-issue': modalConfirmDelete(issueByKey(key)); break;
    case 'confirm-delete': { const is = issueByKey(key); deleteIssue(is); closeModal(); closeIssue(); toast(`${is.key} deleted`); break; }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#menu-root').innerHTML) { $('#menu-root').innerHTML = ''; return; }
    if ($('#modal-root').innerHTML) { closeModal(); return; }
    if (route().q.get('issue')) { closeIssue(); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.desc-view')) { e.preventDefault(); e.target.click(); }
  // Keyboard scheduling on timeline bars
  const bar = e.target.closest && e.target.closest('.tl-bar[data-bar]');
  if (bar && ['ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const is = issueByKey(bar.dataset.bar);
    const step = e.key === 'ArrowLeft' ? -1 : 1;
    const patch = e.shiftKey
      ? { dueDate: addDays(is.dueDate, step) }
      : { startDate: addDays(is.startDate, step), dueDate: addDays(is.dueDate, step) };
    if (patch.dueDate < (patch.startDate || is.startDate)) return;
    updateIssue(is, patch);
    const again = $(`.tl-bar[data-bar="${is.key}"]`); if (again) again.focus();
    announce(`${is.key}: ${fmtDate(is.startDate)} to ${fmtDate(is.dueDate)}`);
  }
});

function suggestKey(name) {
  const words = name.toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
  let key = words.length > 1 ? words.map(w => w[0]).join('').slice(0, 5) : (words[0] || '').slice(0, 4);
  key = key.replace(/^[0-9]+/, '');
  if (key.length < 2) key = (words.join('') + 'XX').replace(/^[0-9]+/, '').slice(0, 3);
  let candidate = key, n = 2;
  while (S.projects.some(p => p.key === candidate)) candidate = (key.slice(0, 8) + n++);
  return candidate;
}
document.addEventListener('input', e => {
  if (e.target.id === 'np-key') e.target.dataset.touched = '1';
  if (e.target.id === 'np-name') {
    const keyEl = $('#np-key');
    if (keyEl && !keyEl.dataset.touched) keyEl.value = e.target.value.trim() ? suggestKey(e.target.value) : '';
    return;
  }
  const k = e.target.dataset.input;
  if (!k) return;
  const v = e.target.value;
  if (k === 'projects-q') UI.projectsQ = v;
  if (k === 'backlog-q') UI.backlog.q = v;
  if (k === 'board-q') UI.board.q = v;
  if (k === 'issues-q') UI.issues.q = v;
  if (k === 'timeline-q') UI.timeline.q = v;
  render();
});

document.addEventListener('change', e => {
  const t = e.target;
  const k = t.dataset.change;
  if (k) {
    if (k === 'backlog-epic') UI.backlog.epic = t.value;
    if (k === 'backlog-mine') UI.backlog.mine = t.checked;
    if (k === 'board-mine') UI.board.mine = t.checked;
    if (k === 'board-epic') UI.board.epic = t.value;
    if (k.startsWith('f-')) UI.issues[k.slice(2)] = t.value;
    if (k === 'ni-project') { const form = t.form; const data = { projectId: t.value, type: form.elements.type.value }; const s = form.elements.summary.value; modalCreateIssue(data); $('#ni-summary').value = s; return; }
    if (k === 'sprint-duration') { const f = t.form; f.elements.endDate.value = addDays(f.elements.startDate.value, Number(f.elements.weeks.value) * 7 - 1); return; }
    render();
    return;
  }
  const field = t.dataset.changeField;
  if (field) {
    const is = issueByKey(t.dataset.key);
    let v = t.value;
    if (field === 'summary') { v = v.trim(); if (!v) { t.value = is.summary; toast('Summary cannot be empty'); return; } }
    if (field === 'points') v = v === '' ? null : Math.max(0, Math.min(999, Math.round(Number(v) * 10) / 10));
    if (field === 'labels') v = v.split(',').map(x => x.trim().replace(/\s+/g, '-')).filter(Boolean);
    if (['assigneeId', 'sprintId', 'parentId', 'startDate', 'dueDate'].includes(field) && v === '') v = null;
    if (field === 'dueDate' && v && is.startDate && v < is.startDate) { toast('Due date cannot be before the start date'); t.value = is.dueDate || ''; return; }
    if (field === 'startDate' && v && is.dueDate && v > is.dueDate) { toast('Start date cannot be after the due date'); t.value = is.startDate || ''; return; }
    const warnSubs = field === 'status' && v === 'done' && childrenOf(is.id).some(c => c.type === 'subtask' && c.status !== 'done');
    updateIssue(is, { [field]: v });
    if (warnSubs) toast(`${is.key} is done, but some of its sub-tasks are still open`);
    if (field === 'status') announce(`${is.key} moved to ${STATUS_NAME[v]}`);
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  const k = f.dataset.submit;
  if (!k) return;
  e.preventDefault();
  const fd = new FormData(f);
  const val = n => String(fd.get(n) ?? '').trim();
  switch (k) {
    case 'global-search': {
      const q = val('q');
      const hit = /^[A-Za-z][A-Za-z0-9]{1,9}-\d+$/.test(q) && issueByKey(q);
      if (hit) { go(`#/p/${project(hit.projectId).key}/issues?issue=${hit.key}`); f.reset(); }
      else go(`#/search?q=${encodeURIComponent(q)}`);
      break;
    }
    case 'search-page': go(`#/search?q=${encodeURIComponent(val('q'))}`); break;
    case 'create-project': {
      const name = val('name');
      const keyV = val('key').toUpperCase();
      let ok = true;
      $('#np-name-err').textContent = ''; $('#np-key-err').textContent = '';
      if (!name) { $('#np-name-err').textContent = 'Enter a project name.'; ok = false; }
      else if (S.projects.some(p => p.name.toLowerCase() === name.toLowerCase())) { $('#np-name-err').textContent = 'A project with this name already exists.'; ok = false; }
      if (!/^[A-Z][A-Z0-9]{1,9}$/.test(keyV)) { $('#np-key-err').textContent = 'Use 2–10 letters or digits, starting with a letter.'; ok = false; }
      else if (S.projects.some(p => p.key === keyV)) { $('#np-key-err').textContent = `Key ${keyV} is already used.`; ok = false; }
      if (!ok) { (f.querySelector('.error-text:not(:empty)')?.previousElementSibling?.previousElementSibling || f.elements.name).focus(); announce('Please fix the highlighted fields'); return; }
      const p = { id: uid(), key: keyV, name, type: val('type') || 'scrum', leadId: val('leadId'), description: val('description'), color: S.projects.length, nextNumber: 1, createdAt: nowStamp() };
      S.projects.push(p);
      if (p.type === 'scrum') S.sprints.push({ id: uid(), projectId: p.id, seq: 1, name: `${p.key} Sprint 1`, goal: '', state: 'planned', startDate: TODAY, endDate: addDays(TODAY, 13) });
      save(); closeModal(); go(`#/p/${p.key}/${p.type === 'scrum' ? 'backlog' : 'board'}`);
      toast(`Project <b>${esc(p.name)}</b> created with key ${p.key}`);
      break;
    }
    case 'create-issue': {
      const summary = val('summary');
      if (!summary) { $('#ni-summary-err').textContent = 'Enter a summary.'; $('#ni-summary').focus(); return; }
      const pid = val('projectId');
      const is = createIssue(pid, { type: val('type'), summary, description: val('description'), assigneeId: val('assigneeId'), priority: val('priority'),
        parentId: val('type') === 'epic' ? null : val('parentId'), sprintId: val('type') === 'epic' ? null : val('sprintId'), points: val('points'),
        startDate: val('startDate'), dueDate: val('dueDate'), labels: val('labels').split(',').map(x => x.trim()).filter(Boolean) });
      if (fd.get('another')) { modalCreateIssue({ projectId: pid, type: val('type') }); $('#modal-root [name="another"]').checked = true; }
      else closeModal();
      render();
      toast(`<b>${is.key}</b> created`, `<button data-action="open-issue" data-key="${is.key}">View</button>`);
      break;
    }
    case 'inline-create': {
      const summary = val('summary');
      if (!summary) return;
      const p = currentProject();
      const is = createIssue(p.id, { type: val('type'), summary });
      render(); $('#ic-sum')?.focus();
      announce(`${is.key} created`);
      break;
    }
    case 'create-epic': {
      const summary = val('summary');
      if (!summary) return;
      const p = currentProject();
      const is = createIssue(p.id, { type: 'epic', summary, startDate: TODAY, dueDate: addDays(TODAY, 27) });
      render(); $('#tl-new')?.focus();
      toast(`Epic <b>${is.key}</b> created — drag it to plan`);
      break;
    }
    case 'add-child': {
      const summary = val('summary');
      if (!summary) return;
      const parent = issueByKey(f.dataset.key);
      const is = createIssue(parent.projectId, { type: f.dataset.type, summary, parentId: parent.id, sprintId: f.dataset.type === 'subtask' ? parent.sprintId : null });
      render(); $('#pi-child')?.focus();
      announce(`${is.key} added`);
      break;
    }
    case 'add-comment': {
      const body = val('body');
      if (!body) return;
      const is = issueByKey(f.dataset.key);
      S.comments.push({ id: uid(), issueId: is.id, authorId: S.currentUserId, body, createdAt: nowStamp() });
      log(is, 'added a <b>comment</b>'); is.updatedAt = nowStamp(); save(); render();
      break;
    }
    case 'save-desc': { UI.editingDesc = false; updateIssue(issueByKey(f.dataset.key), { description: String(fd.get('description') || '') }); render(); break; }
    case 'save-project': {
      const p = projectByKey(f.dataset.key);
      const name = val('name');
      if (!name) { toast('Project name is required'); return; }
      Object.assign(p, { name, leadId: val('leadId'), description: val('description') });
      save(); render(); toast('Project settings saved');
      break;
    }
    case 'start-sprint': {
      const s = sprint(f.dataset.id);
      const startDate = val('startDate'), endDate = val('endDate');
      if (!startDate || !endDate || endDate <= startDate) { $('#ss-err').textContent = 'The end date must be after the start date.'; return; }
      if (activeSprint(s.projectId)) { $('#ss-err').textContent = 'Only one sprint can be active at a time.'; return; }
      Object.assign(s, { name: val('name') || s.name, goal: val('goal'), startDate, endDate, state: 'active' });
      save(); closeModal(); go(`#/p/${project(s.projectId).key}/board`); toast(`<b>${esc(s.name)}</b> started`);
      break;
    }
    case 'complete-sprint': {
      const s = sprint(f.dataset.id);
      const to = val('to') || null;
      const open = issuesOf(s.projectId).filter(i => i.sprintId === s.id && i.status !== 'done' && i.type !== 'subtask');
      open.forEach(i => updateIssue(i, { sprintId: to }, { silent: true }));
      s.state = 'completed';
      save(); closeModal(); go(`#/p/${project(s.projectId).key}/backlog`);
      toast(`<b>${esc(s.name)}</b> completed${open.length ? ` · ${open.length} open issue${open.length > 1 ? 's' : ''} moved to ${to ? esc(sprint(to).name) : 'the backlog'}` : ''}`);
      break;
    }
  }
});

function doMove(el) {
  const is = issueByKey(el.dataset.key);
  const p = project(is.projectId);
  closeModal();
  if (el.dataset.status) { updateIssue(is, { status: el.dataset.status }); toast(`${is.key} moved to ${STATUS_NAME[is.status]}`); return; }
  if ('sprint' in el.dataset) {
    const to = el.dataset.sprint || null;
    const siblings = issuesOf(p.id).filter(i => i.type !== 'epic' && i.type !== 'subtask' && (i.sprintId || null) === to);
    updateIssue(is, { sprintId: to, rank: siblings.length ? Math.max(...siblings.map(i => i.rank)) + 10 : is.rank });
    toast(`${is.key} moved to ${to ? esc(sprint(to).name) : 'the backlog'}`); return;
  }
  const scope = el.dataset.context === 'board' ? boardIssues(p).filter(i => i.status === is.status) : issuesOf(p.id).filter(i => i.type !== 'epic' && i.type !== 'subtask' && (i.sprintId || null) === (is.sprintId || null));
  const ranks = scope.filter(i => i.id !== is.id).map(i => i.rank);
  if (!ranks.length) return;
  updateIssue(is, { rank: el.dataset.pos === 'top' ? Math.min(...ranks) - 10 : Math.max(...ranks) + 10 });
  log(is, `ranked to the <b>${el.dataset.pos}</b>`); save(); render();
  announce(`${is.key} moved to the ${el.dataset.pos}`);
}

/* ---------- Drag and drop (board & backlog) ---------- */
let dragKey = null;
let dragState = null;
document.addEventListener('dragstart', e => {
  const it = e.target.closest('[data-dnd]');
  if (!it) return;
  dragKey = it.dataset.key;
  it.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragKey); } catch (err) { /* ignore */ }
});
document.addEventListener('dragend', e => {
  const it = e.target.closest('[data-dnd]'); if (it) it.classList.remove('dragging');
  $$('.drop-line').forEach(x => x.remove()); $$('.drop-target').forEach(x => x.classList.remove('drop-target'));
  dragKey = null;
});
function dropPosition(zone, y) {
  const items = $$('[data-dnd]', zone).filter(x => x.dataset.key !== dragKey);
  const before = items.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
  return { items, before };
}
document.addEventListener('dragover', e => {
  const zone = e.target.closest('[data-drop]');
  if (!zone || !dragKey) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  $$('.drop-target').forEach(x => x !== zone && x.classList.remove('drop-target'));
  zone.classList.add('drop-target');
  const { before } = dropPosition(zone, e.clientY);
  let line = $('.drop-line');
  if (!line) { line = document.createElement(zone.tagName === 'UL' ? 'li' : 'div'); line.className = 'drop-line'; }
  if (before) zone.insertBefore(line, before); else zone.appendChild(line);
});
document.addEventListener('drop', e => {
  const zone = e.target.closest('[data-drop]');
  if (!zone || !dragKey) return;
  e.preventDefault();
  const is = issueByKey(dragKey);
  const { items, before } = dropPosition(zone, e.clientY);
  const idx = before ? items.indexOf(before) : items.length;
  const prev = idx > 0 ? issueByKey(items[idx - 1].dataset.key).rank : null;
  const next = before ? issueByKey(before.dataset.key).rank : null;
  const rank = rankBetween(prev, next);
  if (zone.dataset.drop === 'board') {
    const status = zone.dataset.status;
    const moved = is.status !== status;
    updateIssue(is, { status, rank });
    if (moved) { toast(`${is.key} moved to ${STATUS_NAME[status]}`); announce(`${is.key} moved to ${STATUS_NAME[status]}`); }
  } else {
    const c = zone.dataset.container;
    const sprintId = c === 'backlog' ? null : c;
    const moved = (is.sprintId || null) !== sprintId;
    updateIssue(is, { sprintId, rank });
    if (moved) toast(`${is.key} moved to ${sprintId ? esc(sprint(sprintId).name) : 'the backlog'}`);
  }
  dragKey = null;
});

/* ---------- Timeline bar dragging (pointer events) ---------- */
document.addEventListener('pointerdown', e => {
  const bar = e.target.closest('.tl-bar[data-bar]');
  if (!bar || e.button !== 0) return;
  const is = issueByKey(bar.dataset.bar);
  dragState = { bar, is, mode: e.target.dataset.edge || 'move', x0: e.clientX, left0: parseFloat(bar.style.left), w0: parseFloat(bar.style.width), dayW: ZOOM[UI.timeline.zoom], delta: 0 };
  bar.setPointerCapture(e.pointerId);
  bar.classList.add('dragging');
  tip.classList.remove('show');
});
document.addEventListener('pointermove', e => {
  if (!dragState) return;
  const d = dragState;
  const delta = Math.round((e.clientX - d.x0) / d.dayW);
  const days = Math.round(d.w0 / d.dayW);
  if (d.mode === 'start' && delta >= days) return;
  if (d.mode === 'end' && -delta >= days) return;
  d.delta = delta;
  if (d.mode === 'move') d.bar.style.left = `${d.left0 + delta * d.dayW}px`;
  if (d.mode === 'start') { d.bar.style.left = `${d.left0 + delta * d.dayW}px`; d.bar.style.width = `${d.w0 - delta * d.dayW}px`; }
  if (d.mode === 'end') d.bar.style.width = `${d.w0 + delta * d.dayW}px`;
  const s = d.mode === 'end' ? d.is.startDate : addDays(d.is.startDate, delta);
  const en = d.mode === 'start' ? d.is.dueDate : addDays(d.is.dueDate, delta);
  tip.textContent = `${fmtDate(s)} – ${fmtDate(en)}`;
  tip.classList.add('show');
  tip.style.left = `${e.clientX + 12}px`; tip.style.top = `${e.clientY - 36}px`;
});
document.addEventListener('pointerup', () => {
  if (!dragState) return;
  const d = dragState;
  dragState = null;
  tip.classList.remove('show');
  d.bar.classList.remove('dragging');
  if (!d.delta) return;
  const patch = d.mode === 'move' ? { startDate: addDays(d.is.startDate, d.delta), dueDate: addDays(d.is.dueDate, d.delta) }
    : d.mode === 'start' ? { startDate: addDays(d.is.startDate, d.delta) } : { dueDate: addDays(d.is.dueDate, d.delta) };
  updateIssue(d.is, patch);
  toast(`${d.is.key}: ${fmtDate(d.is.startDate)} – ${fmtDate(d.is.dueDate)}`);
});
// A click right after a drag should not open anything
document.addEventListener('click', e => { if (e.target.closest('.tl-bar[data-bar]') && !e.target.closest('[data-action]')) { /* bars open via their row name */ } }, true);
document.addEventListener('dblclick', e => { const bar = e.target.closest('.tl-bar[data-bar]'); if (bar) openIssue(bar.dataset.bar); });

function scrollTimelineToToday(smooth) {
  const sc = $('#tl-scroll'); if (!sc) return;
  const today = $('.tl-today', sc); if (!today) return;
  sc.scrollTo({ left: Math.max(0, parseFloat(today.style.left) - sc.clientWidth * 0.3), behavior: smooth ? 'smooth' : 'auto' });
}

let lastRouteKey = '';
function afterRender(r) {
  const routeKey = r.parts.join('/');
  if (routeKey !== lastRouteKey) {
    lastRouteKey = routeKey;
    if (r.parts[2] === 'timeline') scrollTimelineToToday();
    if (!r.q.get('issue')) $('#main').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
  if (r.q.get('issue') && !$('#panel-root').contains(document.activeElement)) $('#panel-close')?.focus({ preventScroll: true });
  document.title = (() => {
    const p = currentProject();
    const v = r.parts[2] || 'summary';
    if (r.q.get('issue')) return `${r.q.get('issue')} · U-PMS Prototype`;
    if (p) return `${v[0].toUpperCase() + v.slice(1)} · ${p.name} · U-PMS Prototype`;
    return 'U-PMS Prototype';
  })();
}

window.addEventListener('hashchange', render);
render();
})();
</script>
