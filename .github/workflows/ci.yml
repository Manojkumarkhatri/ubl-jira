# U-PMS continuous integration: the quality gates from the constitution
# (format, build with warnings as errors and dependency audit, tests, EF model check, end-to-end).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Upms.slnx
      - name: Check formatting
        run: dotnet format Upms.slnx --verify-no-changes --no-restore
      - name: Build (warnings as errors, NuGet audit)
        run: dotnet build Upms.slnx -c Release --no-restore
      - name: Test (unit, integration, component, architecture)
        run: >-
          dotnet test Upms.slnx -c Release --no-build
          --filter "Category!=Performance&FullyQualifiedName!~Upms.E2E.Tests"
          --logger "trx;LogFilePrefix=results" --results-directory TestResults
      - name: EF Core model and migrations in sync
        run: dotnet ef migrations has-pending-model-changes --project src/Upms.Infrastructure --startup-project src/Upms.Web -c Release --no-build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  end-to-end:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build tests/Upms.E2E.Tests -c Release
      - name: Install Playwright browsers
        run: pwsh tests/Upms.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: End-to-end tests with accessibility scans
        run: dotnet test tests/Upms.E2E.Tests -c Release --no-build --logger "trx;LogFilePrefix=e2e" --results-directory TestResults
      - name: Upload results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            TestResults
            tests/Upms.E2E.Tests/bin/Release/net10.0/traces
