# Local development database for U-PMS (quickstart step 1).
# Set MSSQL_SA_PASSWORD in your shell or in a local .env file (never committed) before starting.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD (at least 8 characters with upper, lower, digit and symbol)}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Malware checks for attachments (Phase 4). The first start downloads virus definitions and takes a few minutes.
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # A development mail server for Phase 4 email: SMTP on 2525, and its inbox at http://localhost:5025.
  smtp4dev:
    image: rnwood/smtp4dev
    ports:
      - "2525:25"
      - "5025:80"

volumes:
  sqlserver-data:
